<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中药学习宝典 · 桌面版</title>
<style>
:root{
  --bg:#f3eee2;--fg:#2d2418;--card:#fdfaf3;--line:#d8cdab;
  --primary:#2f5d3a;--primary-fg:#f0ebe0;--gold:#a67c00;--gold-bg:rgba(212,160,23,.12);
  --danger:#a33030;--warn:#c47a1a;--muted:#8a7d62;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft Yahei","Segoe UI",sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.6}
.layout{display:flex;min-height:100vh;max-width:1500px;margin:0 auto}
/* ---------- 侧栏 ---------- */
.sidebar{width:268px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.brand h1{font-size:20px;color:var(--primary)}
.brand small{color:var(--muted);font-size:12px}
.search-box{position:relative;margin-bottom:14px}
.search-box input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px 0 34px;font-size:13px;color:var(--fg);outline:none}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(47,93,58,.14)}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.moduls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.mod{height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--fg);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.mod.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.shen-toggle{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.shen-toggle button{flex:1;height:34px;border:1px solid rgba(212,160,23,.55);background:var(--gold-bg);color:var(--gold);border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.shen-toggle button.on{background:var(--gold);color:#fff}
.cats-title{font-size:12px;color:var(--muted);margin:0 2px 8px}
.cats{display:flex;flex-direction:column;gap:2px;padding-right:2px}
.cat-toggle{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 10px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--primary);background:rgba(47,93,58,.05);border:1px dashed rgba(47,93,58,.3);margin-top:2px}
.cat-toggle:hover{background:rgba(47,93,58,.1)}
.cat.collapsed-item{display:none}
.cats.expanded .cat.collapsed-item{display:flex}
.cat{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--fg);border:1px solid transparent}
.cat:hover{background:rgba(47,93,58,.07)}
.cat.on{background:rgba(47,93,58,.12);border-color:rgba(47,93,58,.25);color:var(--primary);font-weight:600}
.cat .n{font-size:11px;color:var(--muted)}
.cat.dim{opacity:.45}
.sidebar-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7}
.legend{display:flex;align-items:center;gap:5px;margin-top:4px}
.dot-gold{width:8px;height:8px;border-radius:2px;background:var(--gold)}
/* 学习工具入口 */
.tools-title{font-size:12px;color:var(--muted);margin:16px 2px 8px}
.tools-nav{display:flex;flex-direction:column;gap:5px}
.tool-btn{display:block;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;color:var(--fg);cursor:pointer;transition:all .15s}
.tool-btn:hover{background:rgba(47,93,58,.06)}
.tool-btn.on{background:rgba(47,93,58,.1);border-color:rgba(47,93,58,.35);color:var(--primary);font-weight:600}
/* 工具页宽屏排版 */
.tool-wrap{font-size:14px}
.tool-note{font-size:12.5px;color:var(--muted);line-height:1.7;background:rgba(47,93,58,.05);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.tw-clock{background:linear-gradient(135deg,rgba(47,93,58,.09),rgba(212,160,23,.08));border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:16px}
.tw-clock .clk{font-size:34px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;letter-spacing:1px}
.tw-clock .dt{font-size:13px;color:var(--muted);margin-top:2px}
.tw-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.tw-cell{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:12px 14px}
.tw-cell .lab{font-size:12px;color:var(--muted)}
.tw-cell .val{font-size:17px;font-weight:700;margin-top:4px}
.tw-cell .sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.tw-cell.warn{border-color:rgba(163,48,48,.35);background:rgba(163,48,48,.04)}
.tw-cell.warn .val{color:var(--danger)}
.tw-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.tw-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tw-card h4{font-size:14px;color:var(--primary);margin-bottom:10px}
.tw-taboo{border:1px solid rgba(163,48,48,.35);background:rgba(163,48,48,.05);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.tw-taboo .tt{font-size:14px;font-weight:700;color:var(--danger);margin-bottom:6px}
.tw-taboo .bd{font-size:13.5px;line-height:1.8}
.tw-taboo .bd b{color:var(--danger)}
.tw-taboo .src{font-size:11px;color:var(--muted);margin-top:8px}
.tw-table{width:100%;border-collapse:collapse;font-size:13px}
.tw-table th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
.tw-table td{padding:9px 8px;border-bottom:1px dashed var(--line);line-height:1.5}
.tw-table tr:last-child td{border-bottom:none}
.tw-table tr.cur td{background:rgba(47,93,58,.08);font-weight:600}
.tw-tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;background:rgba(47,93,58,.1);color:var(--primary);margin-left:5px}
.tw-count{font-size:11px;color:var(--muted);font-weight:400}
.tw-crisis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.cz-item{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:11px 13px}
.cz-item .el{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.cz-item .when{font-size:12.5px;margin-top:4px;font-weight:600}
.cz-item .organ{font-size:12px;color:var(--danger);margin-top:3px}
.cz-item .rel{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.cz-item.is-cur{border-color:var(--danger);box-shadow:0 0 0 1px rgba(163,48,48,.25) inset}
.cz-badge{font-size:10.5px;background:var(--danger);color:#fff;border-radius:8px;padding:1px 8px;margin-left:auto;font-weight:600}
@media(max-width:900px){.tw-grid{grid-template-columns:1fr 1fr}.tw-cols{grid-template-columns:1fr}}
/* ===== 脉诊速记（桌面宽屏） ===== */
.wp-note{font-size:12.5px;color:var(--muted);line-height:1.7;background:rgba(47,93,58,.05);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.wp-cols{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
@media(max-width:1000px){.wp-cols{grid-template-columns:1fr}}
.wp-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.wp-card h4{font-size:14px;color:var(--primary);margin-bottom:10px}
.wp-parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.wp-parts{grid-template-columns:1fr}}
.wp-part{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.wp-part-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;background:rgba(47,93,58,.05);font-size:13.5px;font-weight:600}
.wp-part-head .arrow{transition:transform .25s;color:var(--muted)}
.wp-part.open .wp-part-head .arrow{transform:rotate(180deg)}
.wp-part-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.wp-part.open .wp-part-body{max-height:600px}
.wp-layer{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px dashed var(--line)}
.wp-layer .lb{width:88px;flex-shrink:0;font-size:12px;color:var(--muted)}
.wp-layer button{flex:1;text-align:left;height:32px;border:1px dashed var(--line);border-radius:7px;background:#fff;font-size:12px;color:var(--muted);padding:0 10px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wp-layer button.has{color:var(--fg);border-style:solid;border-color:var(--primary)}
.wp-meta{display:flex;flex-direction:column;gap:6px}
.wp-mrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.wp-mrow:last-child{border-bottom:none}
.wp-mrow .lb{width:64px;flex-shrink:0;font-size:12.5px;font-weight:600}
.wp-chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.wp-chip{border:1px solid var(--line);background:#fff;border-radius:13px;padding:4px 11px;font-size:12.5px;color:var(--fg);cursor:pointer}
.wp-chip small{font-size:10px;opacity:.65;font-weight:400}
.wp-chip.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.wp-hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px}
.wp-wenrow{padding:7px 0;border-bottom:1px dashed var(--line)}
.wp-wenrow:last-child{border-bottom:none}
.wp-wenlabel{font-size:12.5px;font-weight:600}
.wp-text{width:100%;height:32px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12.5px;padding:0 10px;margin-top:5px}
.wp-note-input{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;padding:9px 10px;margin-top:8px;resize:vertical;min-height:56px;line-height:1.6}
.wp-btnrow{display:flex;gap:8px;margin-top:12px}
.wp-btn{flex:1;height:40px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--primary)}
.wp-btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.wp-btn.reset{flex:0 0 auto;padding:0 16px;color:var(--muted);font-weight:500}
.wp-report{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px}
.wp-report pre{font-size:13px;line-height:1.85;white-space:pre-wrap;word-break:break-word;font-family:inherit;margin:0}
.wp-ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wp-refcard{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 10px}
.wp-refcard .nm{font-size:13.5px;font-weight:700}
.wp-refcard .fl{font-size:11.5px;line-height:1.5;margin-top:2px}
.wp-refcard .zhu{font-size:11.5px;color:var(--primary);margin-top:2px;font-weight:500}
/* 选脉弹层 */
.wp-modal{position:fixed;inset:0;z-index:300;background:rgba(20,16,8,.46);display:none;align-items:center;justify-content:center;padding:24px}
.wp-modal-box{background:var(--bg);border-radius:14px;width:100%;max-width:620px;max-height:82vh;overflow-y:auto;padding:18px 20px}
.wp-modal-title{font-size:15px;font-weight:700;color:var(--primary);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.wp-modal-title .x{width:28px;height:28px;border-radius:50%;background:rgba(47,93,58,.08);color:var(--primary);border:none;cursor:pointer;font-size:14px}
.wp-grouptitle{font-size:12px;font-weight:600;color:var(--primary);margin:12px 0 6px}
.wp-tip{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:8px}
.wp-modal-foot{display:flex;gap:8px;margin-top:16px}
.wp-collapsible-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0;font-size:13px;font-weight:600}
.wp-collapsible-head .arrow{transition:transform .25s;color:var(--muted)}
.wp-collapsible.open .wp-collapsible-head .arrow{transform:rotate(180deg)}
.wp-collapsible-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.wp-collapsible.open .wp-collapsible-body{max-height:1200px}
/* ===== 针灸穴位（桌面） ===== */
.wx-wrap{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:900px){.wx-wrap{grid-template-columns:1fr}}
.wx-side{position:sticky;top:0}
.wx-search{position:relative;margin-bottom:12px}
.wx-search input{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px 0 34px;font-size:13px;outline:none}
.wx-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.wx-mer{border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:6px;overflow:hidden}
.wx-mer-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--fg)}
.wx-mer-head:hover{background:rgba(47,93,58,.05)}
.wx-mer-head .c{font-size:11px;color:var(--muted);font-weight:400}
.wx-mer-head .ar{transition:transform .2s;color:var(--muted)}
.wx-mer.open .wx-mer-head .ar{transform:rotate(180deg)}
.wx-mer-body{max-height:0;overflow:hidden;transition:max-height .25s ease}
.wx-mer.open .wx-mer-body{max-height:none}
.wx-pt{padding:7px 12px;border-top:1px dashed var(--line);cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.wx-pt:hover{background:rgba(47,93,58,.05)}
.wx-pt small{color:var(--muted);font-size:11px;font-weight:400;margin-left:5px}
.wx-detail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;min-height:300px}
.wx-detail .ph{color:var(--muted);text-align:center;padding:60px 0}
.wx-detail h3{font-size:20px;color:var(--primary);margin-bottom:2px}
.wx-detail .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.wx-detail img{max-width:280px;width:100%;display:block;margin:0 auto 4px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:zoom-in}
.wx-detail .cap{text-align:center;font-size:11.5px;color:var(--muted);margin-bottom:14px}
.img-zoom{position:fixed;inset:0;z-index:400;background:rgba(12,9,5,.9);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.img-zoom img{max-width:100%;max-height:100%;border-radius:6px;background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.img-zoom-tip{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:12px;pointer-events:none}
.scroll-lock{overflow:hidden!important}
.wx-field{margin-bottom:11px}
.wx-field .k{font-size:12.5px;font-weight:700;color:var(--primary);margin-bottom:2px}
.wx-field .v{font-size:13.5px;line-height:1.75;white-space:pre-line}
.wx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.wx-card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:11px 13px;cursor:pointer}
.wx-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.wx-card .nm{font-size:14px;font-weight:700}
.wx-card .nm small{font-size:11px;color:var(--muted);font-weight:400;margin-left:5px}
.wx-card .zz{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;padding:22px 28px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h2{font-size:22px;color:var(--primary)}
.stats{display:flex;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted)}
.stat b{color:var(--fg);font-size:13px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
/* 卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;transition:box-shadow .15s,transform .15s}
.hcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.07);transform:translateY(-1px)}
.hcard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.hcard .nm{font-size:17px;font-weight:700}
.hcard .badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:600;border:1px solid currentColor}
.b-shen{color:var(--gold);background:var(--gold-bg);border-color:rgba(212,160,23,.55)!important}
.b-dian{color:var(--primary);background:rgba(47,93,58,.08);border-color:rgba(47,93,58,.4)!important}
.b-dang{color:var(--danger);border-color:rgba(163,48,48,.35)!important}
.b-warn{color:var(--warn);border-color:rgba(196,122,26,.4)!important}
.hcard .cat-tag{font-size:11px;color:var(--muted);margin-left:auto}
.hcard .nature{font-size:12px;color:var(--muted);margin-bottom:6px}
.hcard .effects{font-size:13px;margin-bottom:6px}
.hcard .dose{font-size:12px;color:var(--primary);font-weight:600}
.hcard .kw{margin-top:7px;display:inline-block;background:rgba(47,93,58,.08);color:var(--primary);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:500}
.hcard .alias{font-size:11px;color:var(--muted);margin-top:6px}
.hcard .taboo{margin-top:8px;border:1px solid rgba(163,48,48,.3);background:rgba(163,48,48,.05);border-radius:7px;padding:6px 9px;font-size:12px;color:rgba(163,48,48,.9)}
/* 方剂卡片 */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.fcard h3{font-size:16px;color:var(--primary);margin-bottom:2px}
.fcard .src{font-size:11px;color:var(--muted);margin-bottom:8px}
.fcard .sec{margin:7px 0;font-size:12.5px}
.fcard .lbl{font-size:11px;font-weight:600;color:rgba(47,93,58,.75);display:block;margin-bottom:1px}
.fcard .comp{font-size:12.5px;color:var(--fg)}
.fcard .comp .d{color:var(--muted)}
.fcard .orig{background:rgba(216,205,171,.28);border-radius:7px;padding:6px 9px;margin-top:8px;font-size:11.5px;color:rgba(45,36,24,.72);font-style:italic}
.ftab{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ftab button{padding:6px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px;font-weight:600;cursor:pointer}
.ftab button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.ffcard{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ffhead{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:14px;font-weight:600;color:var(--primary)}
.ffhead:hover{background:rgba(47,93,58,.05)}
.ffcnt{font-size:11px;color:var(--gold);margin-left:auto;font-weight:500}
.ffbody{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:13px;line-height:1.9;color:var(--fg)}
.ffcard.open .ffbody{max-height:20000px;padding:0 12px 12px}
.to-top-ball{position:fixed;right:22px;bottom:26px;z-index:50;width:44px;height:44px;border-radius:50%;background:rgba(47,93,58,.92);color:#fff;border:1px solid rgba(255,255,255,.28);box-shadow:0 4px 14px rgba(20,40,25,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s ease,transform .25s ease}
.to-top-ball.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.to-top-ball:active{transform:scale(.9)}
/* 禁忌 */
.taboo-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.t-col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.t-col h3{font-size:15px;margin-bottom:8px}
.t-col.red h3{color:var(--danger)} .t-col.amber h3{color:var(--warn)} .t-col.rose h3{color:#b43c5a}
.song{font-size:13px;line-height:1.9;background:rgba(216,205,171,.25);border-radius:8px;padding:9px 11px;margin-bottom:10px}
.pillwrap{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 9px}
.pill{font-size:11.5px;border-radius:5px;padding:2px 8px;border:1px solid var(--line)}
.pill.red{color:var(--danger);border-color:rgba(163,48,48,.35)}.pill.gold{color:var(--gold);border-color:rgba(212,160,23,.5)}
.pairrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;border-bottom:1px dashed rgba(216,205,171,.6)}
.pairrow:last-child{border-bottom:none}
.pairrow .mid{font-size:11px;color:var(--warn);padding:0 6px;border:1px solid rgba(196,122,26,.4);border-radius:4px}
.notes{font-size:12px;color:var(--muted);margin-top:8px}
.notes li{margin-left:16px;padding:1px 0}
.ben-modal{position:fixed;inset:0;z-index:300;background:rgba(20,16,8,.46);display:flex;align-items:center;justify-content:center;padding:20px}
.ben-box{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:620px;width:100%;max-height:78vh;overflow-y:auto;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ben-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ben-title{font-size:19px;font-weight:700;color:var(--primary)}
.ben-close{width:28px;height:28px;border-radius:50%;background:rgba(47,93,58,.08);color:var(--primary);cursor:pointer;font-size:14px;border:none}
.ben-note{font-size:15.5px;line-height:1.9;color:var(--fg);margin-bottom:13px;white-space:pre-line}
.ben-note .src{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px;font-weight:600}
.ben-gm{margin-top:4px;border-top:1px solid var(--line);padding-top:12px}
.ben-gm-title{font-size:15px;font-weight:700;color:var(--gold);margin-bottom:9px}
.ben-link{margin-left:6px;font-size:12px;font-weight:600;color:var(--gold);cursor:pointer;border:1px solid rgba(212,160,23,.5);background:var(--gold-bg);border-radius:5px;padding:0 6px}
.jb-link{margin-left:6px;font-size:12px;font-weight:600;color:#5a6ca8;cursor:pointer;border:1px solid rgba(98,114,164,.5);background:rgba(98,114,164,.08);border-radius:5px;padding:0 6px}
@media(max-width:820px){
  .layout{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;max-height:none}
  .cats{max-height:180px}
  .main{padding:16px}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><h1>中药学习宝典</h1><small>桌面版</small></div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="q" type="search" placeholder="搜索药名/拼音/功效/归经/方剂…" autocomplete="off">
    </div>
    <div class="moduls">
      <button class="mod on" data-m="herbs">中药</button>
      <button class="mod" data-m="formulas">经方</button>
      <button class="mod" data-m="taboos">禁忌</button>
    </div>
    <div class="shen-toggle"><button id="shenBtn">⭐ 沈常用 <span id="shenCnt"></span></button></div>
    <div class="cats-title" id="catsTitle">全部类别</div>
    <nav class="cats" id="cats"></nav>
    <div class="tools-title">学习工具</div>
    <nav class="tools-nav">
      <button class="tool-btn" data-m="pulse">🩺 脉诊速记</button>
      <button class="tool-btn" data-m="xuewei">📍 针灸穴位</button>
      <button class="tool-btn" data-m="time">🕐 时辰节气 · 宜忌</button>
      <button class="tool-btn" data-m="crisis">⚠️ 危急推断</button>
    </nav>
    <div class="sidebar-foot">
      <div style="margin-bottom:8px"><a href="index.html" style="font-size:12px;color:var(--primary);text-decoration:none">← 版本选择首页</a></div>
      <div class="legend"><span class="dot-gold"></span> 沈常用（采购买入，见去重表）</div>
      仅供学习参考，用药请遵执证中医师辨证指导。
    </div>
  </aside>

  <main class="main">
    <div class="head">
      <h2 id="mTitle">中药速记</h2>
      <div class="stats" id="statBar"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="ben-modal" id="benModal" style="display:none" onclick="closeBenModal()">
  <div class="ben-box" onclick="event.stopPropagation()">
    <div class="ben-head"><span class="ben-title" id="benTitle">本草详注</span><button class="ben-close" onclick="closeBenModal()">✕</button></div>
    <div class="ben-body" id="benBody"></div>
  </div>
</div>

<script src="bencao.js"></script>
<script src="aliases.js"></script>
<script src="fufang_bencao.js"></script>
<script src="benbei.js"></script>
<script src="kuozhan.js"></script>
<script src="xuewei/xuewei.js"></script>
<div class="ben-modal" id="ffModal" style="display:none" onclick="ffClose()">
  <div class="ben-box" onclick="event.stopPropagation()">
    <div class="ben-head"><span class="ben-title" id="ffTitle">本草纲目 · 附方</span><button class="ben-close" onclick="ffClose()">✕</button></div>
    <div class="ben-body" id="ffBody"></div>
  </div>
</div>

<script src="tcm-data.js"></script>
<script src="jianbie_idx.js"></script>
<script>
// 本草详注弹窗
const GI={'橘皮':'陈皮','生甘草':'甘草','苦桔梗':'桔梗','荆芥穗':'荆芥','半夏曲':'半夏','藿香':'广藿香','紫苏':'紫苏叶','干地黄':'生地黄'};
function herbOfIng(ing){
  if(GI[ing])return GI[ing];
  const AL=typeof ALIAS!=='undefined'?ALIAS:{};
  for(const hh in AL){if(AL[hh]&&AL[hh].includes(ing))return hh;}
  return ing;
}
function bbFind(name){
  if(typeof BEIBAO==='undefined')return null;
  if(BEIBAO[name])return name;
  var al=typeof ALIAS!=='undefined'?ALIAS:{};
  var ks=Object.keys(BEIBAO), i, k, o;
  for(i=0;i<ks.length;i++){
    k=ks[i]; o=BEIBAO[k]&&BEIBAO[k].o;
    if(k===name||o===name)return k;
    if(al[name]&&((al[name].indexOf(k)>-1)||(o&&al[name].indexOf(o)>-1)))return k;
  }
  return null;
}
function herbFormulas(name){
  return FORMULAS.filter(function(f){
    return f[2].some(function(c){
      var ing=c[0],hr=herbOfIng(ing);
      if(hr===name)return true;
      if(name==='甘草'&&(ing==='生甘草'||ing==='炙甘草'))return true;
      return false;
    });
  });
}
function bencaoHTML(name){
  const b=BENCAO&&BENCAO[name]; if(!b)return '';
  let h='';
  if(b.sn)h+='<div class="ben-note"><span class="src">《神农本草经》</span>'+esc(b.sn)+'</div>';
  if(b.gm){
    const g=b.gm,secs=[];
    if(g.w)secs.push(['气味',g.w]);
    if(g.z)secs.push(['主治',g.z]);
    if(g.m)secs.push(['发明·注解',g.m]);
    if(g.p)secs.push(['附方·方剂',g.p]);
    if(g.j)secs.push(['集解·描述',g.j]);
    if(g.s)secs.push(['释名',g.s]);
    if(secs.length)h+='<div class="ben-gm"><div class="ben-gm-title">《本草纲目》</div>'+secs.map(x=>'<div class="ben-note"><span class="src">'+x[0]+'</span>'+esc(x[1])+'</div>').join('')+'</div>';
  }
  if(typeof FUFANG!=='undefined'&&FUFANG[name])h+='<div class="ben-note" style="margin-top:6px"><span class="src">《本草纲目》· 附方</span>'+esc(FUFANG[name])+'</div>';
  const rel=herbFormulas(name);
  if(rel.length)h+='<div class="ben-gm" style="border-top:1px solid rgba(160,140,90,.35);padding-top:10px;margin-top:6px"><div class="ben-gm-title">相关经方 · '+rel.length+' 首</div>'+rel.map(function(f){return '<div class="ben-note"><span class="src">'+f[6]+'</span><b>'+f[0]+'</b>　'+f[2].map(function(c){return c[0]+(c[1]?' '+c[1]:'');}).join('、')+'</div>';}).join('')+'</div>';
  var bn=bbFind(name);
  if(bn)h+='<div class="ben-gm" style="border-top:1px solid rgba(160,140,90,.35);padding-top:10px;margin-top:6px"><div class="ben-gm-title">《本草备要》'+(BEIBAO[bn].o!==bn?'（原书药名：'+esc(BEIBAO[bn].o)+'）':'')+'</div><div class="ben-note" style="font-size:14px">'+esc(BEIBAO[bn].c)+'</div></div>';
  return h;
}
function openBencao(name){
  if(typeof BENCAO==='undefined'||!BENCAO[name])return;
  document.getElementById('benTitle').textContent=name+' · 本草详注';
  document.getElementById('benBody').innerHTML=bencaoHTML(name);
  document.getElementById('benModal').style.display='flex';
}

function closeBenModal(){document.getElementById('benModal').style.display='none';}
const S = {m:'herbs', shen:false, cat:null, q:'', fmode:'classic'};
const $=id=>document.getElementById(id);
const isShen=h=>SHEN_COMMON.has(typeof h==='string'?h:h[0]); // 兼容传药名(h[0])或药材数组
function herbObj(h){return {name:h[0],pinyin:h[1],nature:h[2],meridians:h[3],effects:h[4],dosage:h[5],keyword:h[6],cat:h[7],sub:h[8],taboo:h[9],shen:isShen(h[0])};}
function match(text,kw){if(!kw)return true;const k=kw.toLowerCase().trim();return text.toLowerCase().includes(k);}
function benLink(n){return (typeof BENCAO!=='undefined'&&BENCAO[n])?'<a class="ben-link" onclick="openBencao(\''+n+'\')">📖 本草</a>':'';}
function jbLink(n){return (typeof JBI_IDX!=='undefined'&&JBI_IDX[n])?'<a class="jb-link" onclick="openJianbie(\''+n+'\')">🔍 鉴别</a>':'';}

function baseList(){
  return HERBS.filter(h=>{
    if(S.shen&&!isShen(h))return false;
    if(!match(h[0]+' '+h[4]+' '+h[3]+' '+h[6]+' '+h[7]+' '+h[2]+' '+h[8]+' '+h[1],S.q))return false;
    return true;
  });
}
function renderCats(){
  const el=$('cats');let html='';
  const base=baseList();
  const kzN=typeof KZ!=='undefined'?Object.keys(KZ).filter(k=>!S.q||k.toLowerCase().includes(S.q.toLowerCase())).length:0;
  const jbN=typeof JBI_EXTRA_IDX!=='undefined'?JBI_EXTRA_IDX.filter(k=>!S.q||k.toLowerCase().includes(S.q.toLowerCase())).length:'…';
  html+=`<div class="cat ${S.cat===null?'on':''}" onclick="setCat(null)"><span>全部</span><span class="n">${base.length+kzN+(typeof jbN==='number'?jbN:0)}</span></div>`;
  const VISIBLE=8; // 始终显示的常用分类数，其余折叠
  let hiddenN=0;
  CATEGORIES.forEach((c,i)=>{
    const n=base.filter(h=>h[7]===c.name).length;
    const hidden=i>=VISIBLE && !S.catsExpanded && S.cat!==c.name;
    if(i>=VISIBLE)hiddenN++;
    html+=`<div class="cat ${S.cat===c.name?'on':''}${n===0?' dim':''}${hidden?' collapsed-item':''}" onclick="setCat('${c.name}')"><span>${c.name}</span><span class="n">${n}</span></div>`;
  });
  html+=`<div class="cat ${S.cat==='__kz__'?'on':''}" onclick="setCat('__kz__')"><span>拓展典籍药（本草纲目·备要）</span><span class="n">${kzN}</span></div>`;
  html+=`<div class="cat ${S.cat==='__jb__'?'on':''}" onclick="setCat('__jb__')"><span>其他文献附加分类</span><span class="n">${jbN}</span></div>`;
  html+=`<div class="cat-toggle" onclick="toggleCats()"><span>${S.catsExpanded?'▲ 收起分类':'▼ 展开全部分类（'+hiddenN+'）'}</span></div>`;
  el.classList.toggle('expanded',!!S.catsExpanded);
  el.innerHTML=html;
}
function toggleCats(){S.catsExpanded=!S.catsExpanded;renderCats();}
function setCat(c){S.cat=c;renderCats();render();}
const TOOL_MODS=['pulse','xuewei','time','crisis'];
function setModule(m){S.m=m;S.q='';$('q').value='';
  document.querySelectorAll('.mod,.tool-btn').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const isTool=TOOL_MODS.includes(m);
  $('catsTitle').style.display=(m==='herbs')?'block':'none';
  $('cats').style.display=(m==='herbs')?'flex':'none';
  $('shenBtn').style.display=(m==='herbs')?'':'none';
  $('q').parentElement.style.display=isTool?'none':'block';
  stopToolTimer();render();}
document.querySelectorAll('.mod,.tool-btn').forEach(b=>b.addEventListener('click',()=>setModule(b.dataset.m)));
$('shenBtn').addEventListener('click',()=>{S.shen=!S.shen;$('shenBtn').classList.toggle('on',S.shen);render();});
$('q').addEventListener('input',e=>{S.q=e.target.value;if(S.q.trim()!=='')S.cat=null;render();});

function badgeHTML(h){
  let b=[];if(h.shen)b.push('<span class="badge b-shen">沈常用</span>');
  if(h.taboo.eighteenInverse.length)b.push('<span class="badge b-dang">十八反</span>');
  if(h.taboo.nineteenFear.length)b.push('<span class="badge b-dang">十九畏</span>');
  if(h.taboo.pregnancy==='forbidden')b.push('<span class="badge b-dang">妊娠禁用</span>');
  else if(h.taboo.pregnancy==='caution')b.push('<span class="badge b-warn">妊娠慎用</span>');
  return b.join('');
}
function tabooTxt(h){const p=[];if(h.taboo.eighteenInverse.length)p.push('十八反：'+h.taboo.eighteenInverse.join('、'));
  if(h.taboo.nineteenFear.length)p.push('十九畏：'+h.taboo.nineteenFear.join('、'));
  if(h.taboo.pregnancy)p.push('妊娠：'+(h.taboo.pregnancy==='forbidden'?'禁用':'慎用'));
  return p.length?('<div class="taboo">⚠ '+p.join('　')+'</div>'):'';}

function renderHerbs(){
  if(S.cat==='__kz__'){var _kh=kzGridHTML();$('content').innerHTML=_kh||'<div class="empty">未找到匹配的拓展药材</div>';return;}
  if(S.cat==='__jb__'){
    if(typeof JBI_EXTRA==='undefined'){
      $('content').innerHTML='<div class="empty">鉴别数据加载中…</div>';
      loadScript('jianbie_extra.js',function(){renderCats();$('content').innerHTML=jbExtraHTML();});
    }else{$('content').innerHTML=jbExtraHTML();}
    return;
  }
  const list=HERBS.map(herbObj).filter(h=>{
    if(S.shen&&!h.shen)return false;
    if(S.cat&&h.cat!==S.cat)return false;
    if(!match(h.name+' '+h.effects+' '+h.meridians+' '+h.keyword+' '+h.cat+' '+h.nature+' '+h.sub+' '+h.pinyin,S.q))return false;
    return true;
  });
  const byCat={};
  list.forEach(h=>{(byCat[h.cat]=byCat[h.cat]||[]).push(h);});
  let html='';
  const kzh=(S.cat===null?kzGridHTML():'');
  const jbh=(S.cat===null?jbExtraSearchHTML():'');
  if(list.length===0&&!kzh&&!jbh){$('content').innerHTML='<div class="empty">未找到匹配的中药</div>';return;}
  const order=CATEGORIES.map(c=>c.name);
  Object.keys(byCat).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).forEach(cat=>{
    html+=`<h3 style="color:var(--primary);margin:16px 0 8px;font-size:15px">${cat} <span style="color:var(--muted);font-size:12px">${byCat[cat].length}</span></h3><div class="grid">`;
    byCat[cat].forEach(h=>{
      html+=`<div class="hcard"><div class="top"><span class="nm">${h.name}</span><span class="badge b-dian">药典常用</span>${benLink(h.name)}${jbLink(h.name)}${badgeHTML(h)}
        <span class="cat-tag">${h.sub}</span></div>
        <div class="nature">${h.nature} · ${h.meridians}</div>
        <div class="effects">${h.effects}</div>
        <div><span class="dose">用量：${h.dosage}</span></div>
        <div class="kw">📌 ${h.keyword}</div>
        <div class="alias">别名：${typeof ALIAS!=='undefined'&&ALIAS[h.name]?ALIAS[h.name].join('、'):'-'}</div>${tabooTxt(h)}</div>`;
    });
    html+='</div>';
  });
  html+=kzh+jbh;
  $('content').innerHTML=html;
}
function jbExtraSearchHTML(){
  // 全局搜索时展示文献附加药的命中（只用同步索引，无需加载正文）
  if(typeof JBI_EXTRA_IDX==='undefined'||!S.q)return '';
  const q=S.q.toLowerCase();
  const all=JBI_EXTRA_IDX.filter(k=>k.toLowerCase().includes(q));
  const n=all.slice(0,60); if(!n.length)return '';
  let h='<h3 style="color:var(--primary);margin:16px 0 8px;font-size:15px">其他文献附加分类 <span style="color:var(--muted);font-size:12px">'+all.length+'</span></h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">';
  n.forEach(function(k){h+='<div class="ffcard"><div class="ffhead" onclick="jbSearchOpen(this)" data-n="'+htmlAttr(k)+'"><b>'+k+'</b><span class="ffcnt">文献</span></div></div>';});
  h+='</div>'; return h;
}
function jbSearchOpen(el){
  const k=el.getAttribute('data-n');
  if(typeof JBI_EXTRA!=='undefined'&&JBI_EXTRA[k]){jbShow(el);return;}
  loadScript('jianbie_extra.js',function(){jbShow(el);});
}
function kzGridHTML(){
  if(typeof KZ==='undefined'||!Object.keys(KZ).length)return '';
  const all=Object.keys(KZ).filter(k=>!S.q||k.toLowerCase().includes(S.q.toLowerCase()));
  const kzn=all.slice(0,1200); if(!kzn.length)return '';
  let h='<h3 style="color:var(--primary);margin:16px 0 8px;font-size:15px">拓展典籍药（本草纲目·本草备要） <span style="color:var(--muted);font-size:12px">'+all.length+'</span></h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">';
  kzn.forEach(function(k){var e=KZ[k];h+='<div class="ffcard"><div class="ffhead" onclick="kzWeb(this)" data-n="'+htmlAttr(k)+'"><b>'+k+'</b><span class="ffcnt">'+(e.src.join('、'))+'</span>'+(typeof JBI_IDX!=='undefined'&&JBI_IDX[k]?'<a class="jb-link" onclick="event.stopPropagation();openJianbie(\''+k+'\')">🔍 鉴别</a>':'')+'</div></div>';});
  h+='</div>'; return h;
}
function kzWeb(el){
  var k=el.getAttribute('data-n');
  if(typeof KZ!=='undefined'&&KZ[k]){
    var e=KZ[k];
    document.getElementById('ffTitle').textContent='拓展典籍 · '+k;
    document.getElementById('ffBody').innerHTML='<div style="font-size:12px;color:var(--muted);margin-bottom:6px">来源：'+e.src.join('、')+(e.o&&e.o[0]?('　原书药名：'+e.o[0]):'')+'</div><div class="ben-note">'+esc(e.d)+'</div>';
    document.getElementById('ffModal').style.display='flex';
  }
}
// ==================== 中药鉴别（懒加载） ====================
const _jbLoader={};
function loadScript(src,cb){
  cb=cb||function(){};
  const st=_jbLoader[src];
  if(st===true){cb();return;}
  if(st&&st.que){st.que.push(cb);return;}
  _jbLoader[src]={que:[cb]};
  const s=document.createElement('script');
  s.src=src;
  s.onload=function(){const q=_jbLoader[src].que;_jbLoader[src]=true;q.forEach(function(f){f();});};
  s.onerror=function(){_jbLoader[src]=null;alert('鉴别数据加载失败，请检查网络后重试');};
  document.head.appendChild(s);
}
function openJianbie(n){
  if(typeof JBI_IDX==='undefined'||!JBI_IDX[n])return;
  const show=function(){
    const e=JBI&&JBI[n];if(!e)return;
    $('ffTitle').textContent=n+' · 鉴别';
    $('ffBody').innerHTML='<div style="font-size:12px;color:var(--muted);margin-bottom:6px">出处：中药世家 · 开源数据（Apache-2.0）'+(e.o&&e.o!==n?'　数据集原药名：'+esc(e.o):'')+'</div><div class="ben-note">'+esc(e.d)+'</div>';
    $('ffModal').style.display='flex';
  };
  if(typeof JBI==='undefined'||!JBI[n])loadScript('jianbie.js',show);else show();
}
function jbExtraHTML(){
  if(typeof JBI_EXTRA==='undefined')return '<div class="empty">鉴别数据加载中…</div>';
  const all=Object.keys(JBI_EXTRA).filter(k=>!S.q||k.toLowerCase().includes(S.q.toLowerCase()));
  const n=all.slice(0,1200); if(!n.length)return '<div class="empty">未找到匹配的药材</div>';

function wSolarLongitude(date){
  const jd=date.getTime()/86400000+2440587.5;
  const T=(jd-2451545.0)/36525;
  let L0=((280.46646+36000.76983*T+0.0003032*T*T)%360+360)%360;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*Math.PI/180;
  const C=Math.sin(M)*(1.914602-0.004817*T-0.000014*T*T)+Math.sin(2*M)*(0.019993-0.000101*T)+Math.sin(3*M)*0.000289;
  const om=(125.04-1934.136*T)*Math.PI/180;
  return ((L0+C-0.00569-0.00478*Math.sin(om))%360+360)%360;
}
function wTermIdxAt(d){return Math.floor(wSolarLongitude(d)/15);}
function wSample(d){const x=new Date(d);x.setHours(23,50,0,0);return x;}
function wTodayTerm(now){const t=wSample(now),y=new Date(t);y.setDate(y.getDate()-1);const a=wTermIdxAt(y),b=wTermIdxAt(t);return a!==b?W_TERMS[b]:null;}

function wAllTermDates(year){const out={};const d=wSample(new Date(year,0,1));let prev=wTermIdxAt(wSample(new Date(year-1,11,31)));for(let i=0;i<366;i++){const idx=wTermIdxAt(d);if(idx!==prev&&!out[W_TERMS[idx]])out[W_TERMS[idx]]=new Date(year,d.getMonth(),d.getDate());prev=idx;d.setDate(d.getDate()+1);}return out;}

   +  '<div class="wp-card"><h4>十问歌 · 问诊要点</h4><div id="wpWen"></div></div>'
   +  '<div class="wp-card"><h4>生成记录</h4>'
   +    '<textarea class="wp-note-input" id="wpNote" placeholder="备注：症状、舌象、病史等补充信息…"></textarea>'
   +    '<div class="wp-btnrow"><button class="wp-btn primary" onclick="wpGenReport()">生成脉诊记录</button><button class="wp-btn" id="wpCopyBtn" onclick="wpCopy()">复制</button></div>'
   +    '<div class="wp-report" id="wpReportBox" style="display:none"><pre id="wpReportText"></pre></div>'
   +  '</div>'
   +'</div>'
   +'</div></div>'
   +'<div class="wp-modal" id="wpModal" onclick="if(event.target===this)wpClosePick()"><div class="wp-modal-box">'
   +  '<div class="wp-modal-title"><span id="wpPickTitle">选脉</span><button class="x" onclick="wpClosePick()">✕</button></div>'
   +  '<div class="wp-tip">基础脉可多选组合成相兼脉（如弦+滑）；点复合脉自动勾选其构成基础脉并带出力度。</div>'
   +  '<div class="wp-grouptitle">基础脉（可多选）</div><div class="wp-chipwrap" id="wpChipsBase"></div>'
   +  '<div class="wp-grouptitle">复合脉（括号内为构成）</div><div class="wp-chipwrap" id="wpChipsComp"></div>'
   +  '<div class="wp-grouptitle">力度（单选，再点取消）</div><div class="wp-chipwrap" id="wpChipsForce"></div>'
   +  '<div class="wp-modal-foot"><button class="wp-btn" onclick="wpClearLayer()">清空本层</button><button class="wp-btn primary" onclick="wpClosePick()">完成</button></div>'
   +'</div></div>';

  // 六部（每部折叠卡，内三层）
  $('wpParts').innerHTML=WP_PARTS.map(p=>{
    const rows=WP_LAYERS.map(l=>{
      const arr=(wpSel[p[0]]&&wpSel[p[0]][l[0]])||[];
      const f=(wpForce[p[0]]&&wpForce[p[0]][l[0]])||'';
      const label=arr.length?arr.map(m=>m+(wpCompOf[m]?'脉('+wpCompOf[m]+')':'脉')).join(' · '):'点击选脉';
      return '<div class="wp-layer"><span class="lb">'+l[1]+'</span><button class="'+(arr.length||f?'has':'')+'" data-part="'+p[0]+'" data-layer="'+l[0]+'" onclick="wpOpenPick(this)">'+label+'</button></div>';
    }).join('');
    return '<div class="wp-part open" data-part="'+p[0]+'"><div class="wp-part-head" onclick="wpTogglePart(this)"><span>'+p[0]+'（'+p[1]+'）<span class="wp-part-sum" data-sum="'+p[0]+'"></span></span><svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div><div class="wp-part-body">'+rows+'</div></div>';
  }).join('');

  // 速记参考（六组折叠）
  $('wpRef').innerHTML=WP_GROUPS.map((g,i)=>{
    const cards=g.list.map(x=>'<div class="wp-refcard"><div class="nm">'+x[0]+'脉</div><div class="fl">'+x[1]+'</div><div class="zhu">'+x[2]+'</div></div>').join('');
    return '<div class="wp-collapsible'+(i===0?' open':'')+'"><div class="wp-collapsible-head" onclick="wpToggleColl(this)"><span>'+g.name+'</span><svg class="arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div><div class="wp-collapsible-body"><div class="wp-ref-grid" style="padding:8px 0 4px">'+cards+'</div></div></div>';
  }).join('');

  $('wpNote').value=wpNote||'';
  $('wpNote').oninput=function(){wpNote=this.value;wpSet('tcm_pulse_note',wpNote);};
  wpRenderMeta();wpRenderWen();WP_PARTS.forEach(p=>wpPartSummary(p[0]));
}
function wpTogglePart(headEl){headEl.parentElement.classList.toggle('open');}
function wpPartSummary(part){
  const card=document.querySelector('#wpParts .wp-part[data-part="'+part+'"]');
  if(!card)return;
  const sum=WP_LAYERS.map(l=>{
    const arr=(wpSel[part]&&wpSel[part][l[0]])||[];
    if(!arr.length)return '';
    const f=(wpForce[part]&&wpForce[part][l[0]])||'';
    return l[0]+wpLayerLabel(part,l[0])+(f?'·'+f:'');
  }).filter(Boolean).join(' ');
  const el=card.querySelector('.wp-part-sum');
  if(el)el.textContent=sum?'　'+sum:'';
}
function wpRenderMeta(){
  const chip=(label,val,cur)=>'<button class="wp-chip'+(cur===val?' on':'')+'" data-name="'+val+'" onclick="wpPersonToggle(this)">'+label+'</button>';
  let h='<div class="wp-mrow"><span class="lb">对象</span><div class="wp-chipwrap">';
  ['男','女','小儿'].forEach(p=>h+=chip(p,p,wpPerson));
  h+='</div></div><div class="wp-mrow"><span class="lb">年龄</span><div class="wp-chipwrap">';
  h+=chip('儿童(<14)','儿童',wpAge)+chip('青少年(14-18)','青少年',wpAge)+chip('成年(18-59)','成年',wpAge)+chip('老年(≥60)','老年',wpAge);
  h+='</div></div>';
  if(wpAge==='儿童'||wpAge==='青少年')h+='<div class="wp-hint">小儿中药量按年龄折算（成人量）：1-2岁约1/5-1/4，2-4岁约1/4-1/3，4-6岁约1/3-2/5，6-9岁约2/5-1/2，9-14岁约1/2-2/3，仅供参考</div>';
  if(wpPerson==='小儿')h+='<div class="wp-hint">小儿（3岁以下）脉诊常用一指定三关</div>';
  h+='<div class="wp-mrow"><span class="lb">左右脉力</span><div class="wp-chipwrap">';
  ['左手强','右手强','两手相当'].forEach(p=>h+=chip(p,p,wpSide));
  h+='</div></div>';
  $('wpMeta').innerHTML=h;
}
function wpPersonToggle(el){
  const val=el.dataset.name;
  if(['男','女','小儿'].includes(val)){wpPerson=(wpPerson===val)?'':val;wpSet('tcm_wen_person',wpPerson);wpRenderMeta();wpRenderWen();}
  else if(['儿童','青少年','成年','老年'].includes(val)){wpAge=(wpAge===val)?'':val;wpSet('tcm_wen_age',wpAge);wpRenderMeta();}
  else{wpSide=(wpSide===val)?'':val;wpSet('tcm_pulse_side',wpSide);wpRenderMeta();}
}
function wpRenderWen(){
  const row=it=>{
    const cur=wpWen[it[0]]||[];
    const chips=it[1].map(c=>'<button class="wp-chip'+(cur.indexOf(c)>=0?' on':'')+'" data-group="'+it[0]+'" data-name="'+c+'" onclick="wpWenToggle(this)">'+c+'</button>').join('');
    return '<div class="wp-wenrow"><div class="wp-wenlabel">'+it[0]+'</div><div class="wp-chipwrap" style="margin-top:5px">'+chips+'</div>'+(it[2]?'<div class="wp-hint">'+it[2]+'</div>':'')+'</div>';
  };
  const text=it=>'<div class="wp-wenrow"><div class="wp-wenlabel">'+it[0]+'</div><input class="wp-text" placeholder="'+it[1]+'…" data-group="'+it[0]+'" value="'+(wpWenText[it[0]]||'').replace(/"/g,'&quot;')+'" oninput="wpWenTextInput(this)"></div>';
  const extByName={};WP_WENEXT.forEach(it=>extByName[it[0]]=it);
  const textByName={};WP_WENTEXT.concat(WP_WENTEXTEXT).forEach(it=>textByName[it[0]]=it);
  const group=(title,gid,names,tnames)=>{
    const body=names.map(n=>row(extByName[n])).join('')+tnames.map(n=>text(textByName[n])).join('');
    const cnt=names.reduce((a,n)=>a+(wpWen[n]||[]).length,0)+tnames.filter(n=>(wpWenText[n]||'').trim()).length;
    const open=(wpPerson==='女'&&gid==='妇女')||(wpPerson==='小儿'&&gid==='小儿')||cnt>0;
    return '<div class="wp-collapsible'+(open?' open':'')+'" data-wen="'+gid+'"><div class="wp-collapsible-head" onclick="wpToggleColl(this)"><span>'+title+'</span><span style="font-size:11px;color:var(--muted);font-weight:400">'+(cnt?cnt+' 项已记':'点击展开')+'</span></div><div class="wp-collapsible-body"><div style="padding:6px 0">'+body+'</div></div></div>';
  };
  let h='<div class="wp-hint" style="margin-bottom:8px">歌诀补：妇人尤必问经期，迟速闭崩皆可见；再添片语告儿科，天花麻疹全占验（小儿改问疫苗、惊风、积食）。</div>';
  WP_WEN.forEach(it=>h+=row(it));
  WP_WENTEXT.forEach(it=>h+=text(it));
  h+=group('妇女（经带胎产）','妇女',['妇女·月经','妇女·带下','妇女·胎产'],['孕产史']);
  h+=group('小儿（惊风·积食·疫苗）','小儿',['小儿·惊风','小儿·积食','小儿·疫苗'],['小儿发育']);
  $('wpWen').innerHTML=h;
}
function wpWenGroupOf(n){if(n.indexOf('妇女')===0||n==='孕产史')return'妇女';if(n.indexOf('小儿')===0||n==='小儿发育')return'小儿';return'';}
function wpWenToggle(el){
  const g=el.dataset.group,name=el.dataset.name,arr=wpWen[g]||[],i=arr.indexOf(name);
  if(i>=0)arr.splice(i,1);else arr.push(name);
  wpWen[g]=arr;wpSet('tcm_wen_sel',JSON.stringify(wpWen));
  el.classList.toggle('on',i<0);
}
function wpWenTextInput(el){wpWenText[el.dataset.group]=el.value;wpSet('tcm_wen_text',JSON.stringify(wpWenText));}

function wpOpenPick(btn){
  wpPick={part:btn.dataset.part,layer:btn.dataset.layer};
  const lname=(WP_LAYERS.filter(l=>l[0]===wpPick.layer)[0]||[])[1];
  $('wpPickTitle').textContent=wpPick.part+'（'+wpOrgan(wpPick.part)+'）· '+lname;
  wpRenderPick();
  $('wpModal').style.display='flex';
}
function wpRenderPick(){
  const cur=new Set(((wpSel[wpPick.part]&&wpSel[wpPick.part][wpPick.layer])||[]));
  const chip=(name,hint)=>'<button class="wp-chip'+(cur.has(name)?' on':'')+'" data-name="'+name+'" onclick="wpPickToggle(this)">'+name+(hint?' <small>'+hint+'</small>':'')+'</button>';
  $('wpChipsBase').innerHTML=WP_BASE.map(x=>chip(x[0],x[1])).join('');
  $('wpChipsComp').innerHTML=WP_COMP.map(x=>chip(x[0],x[1])).join('');
  const fcur=(wpForce[wpPick.part]&&wpForce[wpPick.part][wpPick.layer])||'';
  $('wpChipsForce').innerHTML=WP_FORCES.slice(1).map(f=>'<button class="wp-chip'+(fcur===f?' on':'')+'" data-name="'+f+'" onclick="wpForceToggle(this)">'+f+'</button>').join('');
}
function wpForceToggle(el){
  const val=el.dataset.name;
  if(!wpForce[wpPick.part])wpForce[wpPick.part]={};
  wpForce[wpPick.part][wpPick.layer]=(wpForce[wpPick.part][wpPick.layer]===val)?'':val;
  wpSet('tcm_pulse_force',JSON.stringify(wpForce));
  wpRenderPick();wpUpdateRow();wpPartSummary(wpPick.part);
}
function wpPickToggle(el){
  const name=el.dataset.name;
  if(!wpSel[wpPick.part])wpSel[wpPick.part]={};
  const arr=wpSel[wpPick.part][wpPick.layer]||[],i=arr.indexOf(name);
  if(i>=0)arr.splice(i,1);
  else{arr.push(name);
    if(wpCompBases[name]){wpCompBases[name].forEach(b=>{if(arr.indexOf(b)<0)arr.push(b);});if(wpCompForce[name])wpSetForce(wpPick.part,wpPick.layer,wpCompForce[name]);}
  }
  wpSel[wpPick.part][wpPick.layer]=arr;
  wpSet('tcm_pulse_sel',JSON.stringify(wpSel));
  wpRenderPick();wpUpdateRow();wpPartSummary(wpPick.part);
}
function wpSetForce(part,layer,val){if(!wpForce[part])wpForce[part]={};wpForce[part][layer]=val;wpSet('tcm_pulse_force',JSON.stringify(wpForce));if(wpPick&&wpPick.part===part&&wpPick.layer===layer)wpRenderPick();}
function wpUpdateRow(){
  const btn=document.querySelector('#wpParts button[data-part="'+wpPick.part+'"][data-layer="'+wpPick.layer+'"]');
  if(!btn)return;
  const label=wpLayerLabel(wpPick.part,wpPick.layer);
  const f=(wpForce[wpPick.part]&&wpForce[wpPick.part][wpPick.layer])||'';
  btn.textContent=(label?label+'（'+f+'）':(f?'未选脉（'+f+'）':'点击选脉'));
  btn.classList.toggle('has',!!(label||f));
}
function wpClearLayer(){
  if(!wpPick)return;
  if(!wpSel[wpPick.part])wpSel[wpPick.part]={};
  wpSel[wpPick.part][wpPick.layer]=[];
  if(!wpForce[wpPick.part])wpForce[wpPick.part]={};
  wpForce[wpPick.part][wpPick.layer]='';
  wpSet('tcm_pulse_sel',JSON.stringify(wpSel));wpSet('tcm_pulse_force',JSON.stringify(wpForce));
  wpRenderPick();wpUpdateRow();wpPartSummary(wpPick.part);
}
function wpClosePick(){$('wpModal').style.display='none';wpPick=null;}
function wpReset(){
  if(!confirm('确定清空全部选脉、力度、十问与备注吗？'))return;
  wpSel={};wpForce={};wpNote='';wpReport='';wpWen={};wpWenText={};wpPerson='';wpAge='';wpSide='';
  ['tcm_pulse_sel','tcm_pulse_force','tcm_pulse_note','tcm_wen_sel','tcm_wen_text','tcm_wen_person','tcm_wen_age','tcm_pulse_side'].forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});
  renderWebPulse();
}
function wpGenReport(silent){
  const d=new Date(),pad=x=>x<10?'0'+x:''+x;
  let txt='【脉诊记录】'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'\n';
  WP_PARTS.forEach(p=>{
    const sel=wpSel[p[0]]||{},force=wpForce[p[0]]||{},segs=[];
    WP_LAYERS.forEach(l=>{const arr=sel[l[0]]||[];if(!arr.length)return;const f=force[l[0]];segs.push(l[0]+'取：'+wpLayerLabel(p[0],l[0])+(f?'（'+f+'）':''));});
    if(segs.length)txt+=p[0]+'（'+p[1]+'）：'+segs.join('；')+'\n';
  });
  if(wpPerson||wpAge||wpSide){let meta='';if(wpPerson||wpAge)meta+='对象：'+(wpPerson||'未记')+(wpAge?'（'+wpAge+'）':'');if(wpSide)meta+=(meta?'；':'')+'左右脉力：'+wpSide;txt+=meta+'\n';}
  const lines=[];
  WP_WEN.concat(WP_WENEXT).forEach(it=>{const arr=wpWen[it[0]]||[];if(arr.length)lines.push(it[0]+'：'+arr.join('、'));});
  WP_WENTEXT.concat(WP_WENTEXTEXT).forEach(it=>{if(wpWenText[it[0]]&&wpWenText[it[0]].trim())lines.push(it[0]+'：'+wpWenText[it[0]].trim());});
  if(lines.length)txt+='\n—— 十问 ——\n'+lines.join('\n')+'\n';
  txt+='备注：'+(wpNote&&wpNote.trim()?wpNote.trim():'无')+'\n';
  txt+='（以上为脉诊记录，仅供学习交流，请结合四诊合参）';
  wpReport=txt;
  $('wpReportText').textContent=txt;
  $('wpReportBox').style.display='block';
  if(!silent)$('wpReportBox').scrollIntoView({behavior:'smooth',block:'center'});
}
function wpCopy(){
  if(!wpReport)wpGenReport(true);
  const done=()=>{const b=$('wpCopyBtn');const old=b.textContent;b.textContent='已复制 ✓';setTimeout(()=>b.textContent=old,1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(wpReport).then(done,()=>{wpFallbackCopy(wpReport);done();});
  else{wpFallbackCopy(wpReport);done();}
}
function wpFallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}

// ========== 学习工具：针灸穴位 ==========
const WX=(typeof XUEWEI!=='undefined')?XUEWEI:[];
const WX_MERS=(()=>{const o=[];WX.forEach(x=>{if(!o.includes(x.m))o.push(x.m);});return o;})();
let wxState={mer:null,q:''};
function wxNorm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');}
function wxMatch(x,q){if(!q)return true;if(x.n.includes(q))return true;const nq=wxNorm(q);if(nq&&wxNorm(x.py).includes(nq))return true;return (x.zz||'').includes(q)||(x.dw||'').includes(q);}
function renderWebXuewei(){
  const c=$('content');
  c.innerHTML='<div class="tool-wrap"><div class="tool-note">🩺 十四经 <b>'+WX.length+'</b> 穴：定位、解剖、主治、操作（刺灸法）、配伍与体表定位图。左侧按经脉浏览，或搜索穴名/拼音/主治。内容仅供学习，针刺须由执业医师操作。</div>'
   +'<div class="wx-wrap"><div class="wx-side"><div class="wx-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="wxQ" type="search" placeholder="搜索穴名/拼音/主治…"></div><div id="wxMers"></div></div>'
   +'<div class="wx-detail" id="wxDetail"><div class="ph">← 选择左侧穴位查看详情</div></div></div></div>';
  $('wxQ').oninput=e=>{wxState.q=e.target.value.trim();wxState.mer=null;wxRenderMers();};
  wxRenderMers();
}
function wxRenderMers(){
  const q=wxState.q;
  const box=$('wxMers'),det=$('wxDetail');
  if(q){
    const res=WX.map((x,i)=>({x,i})).filter(o=>wxMatch(o.x,q));
    box.innerHTML='<div style="font-size:12px;color:var(--muted);padding:4px 4px 8px">搜索结果 '+res.length+' 穴</div><div class="wx-grid">'+res.map(o=>'<div class="wx-card" onclick="wxShow('+o.i+')"><div class="nm">'+esc(o.x.n)+'</div><div class="zz">'+esc(o.x.zz||o.x.dw||'')+'</div></div>').join('')+'</div>';
    if(det&&det.querySelector('.ph'))det.innerHTML='';
    if(res.length)wxShow(res[0].i);else det.innerHTML='<div class="ph">未找到相关穴位</div>';
    return;
  }
  let h='';
  WX_MERS.forEach((mer,mi)=>{
    const pts=WX.map((x,i)=>({x,i})).filter(o=>o.x.m===mer);
    const open=wxState.mer===mi;
    h+='<div class="wx-mer'+(open?' open':'')+'"><div class="wx-mer-head" onclick="wxToggleMer('+mi+')"><span>'+esc(mer)+' <span class="c">'+pts.length+'</span></span><svg class="ar" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>'
      +'<div class="wx-mer-body">'+pts.map(o=>'<div class="wx-pt" onclick="wxShow('+o.i+')"><span>'+esc(o.x.n)+'<small>'+(o.x.py||'')+'</small></span></div>').join('')+'</div></div>';
  });
  box.innerHTML=h;
  if(det&&det.querySelector('.ph'))det.innerHTML='<div class="ph">← 选择左侧穴位查看详情</div>';
}
function wxToggleMer(mi){wxState.mer=(wxState.mer===mi)?null:mi;wxRenderMers();const box=$('wxMers').querySelectorAll('.wx-mer')[mi];if(box)box.scrollIntoView({block:'nearest'});}
function wxShow(i){
  const x=WX[i];if(!x)return;
  let h='<h3>'+esc(x.n)+(x.py?' <small style="font-size:13px;color:var(--muted);font-weight:400">'+esc(x.py)+'</small>':'')+'</h3>'
    +'<div class="sub">'+esc(x.m)+(x.src?'　出处：《'+esc(x.src)+'》':'')+'</div>';
  if(x.img){h+='<img src="'+esc(x.img)+'" alt="'+esc(x.n)+'" onclick="openZoom(this.src,this.alt)" loading="lazy">';if(x.cap)h+='<div class="cap">'+esc(x.cap)+'（点击放大）</div>';}
  [['定位','dw'],['解剖','jp'],['主治','zz'],['操作（刺灸法）','cz'],['配伍','pw'],['附注','bz']].forEach(f=>{if(x[f[1]])h+='<div class="wx-field"><div class="k">'+f[0]+'</div><div class="v">'+esc(x[f[1]])+'</div></div>';});
  $('wxDetail').innerHTML=h;
}
function openZoom(src,alt){
  $('zoomImg').src=src;
  $('zoomImg').alt=alt||'';
  $('zoomBox').style.display='flex';
  document.documentElement.classList.add('scroll-lock');
  document.body.classList.add('scroll-lock');
}
function closeZoom(){
  $('zoomBox').style.display='none';
  document.documentElement.classList.remove('scroll-lock');
  document.body.classList.remove('scroll-lock');
}

// init
renderCats();render();
</script>

  <img id="zoomImg" alt="">
  <div class="img-zoom-tip">点击任意处返回</div>
</div>
